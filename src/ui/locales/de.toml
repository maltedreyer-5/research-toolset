"Choose a mode below, enter your request and click **🔍 Start research**. For web research you can sharpen your request with me first via **💬 Discuss request**." = "Wählen Sie unten einen Modus, geben Sie Ihre Anfrage ein und klicken Sie auf **🔍 Recherche starten**. Für eine Webrecherche können Sie Ihren Auftrag vorher mit mir über **💬 Auftrag besprechen** schärfen."
"### 🔎 Research modes" = "### 🔎 Recherchemodi"
"**🌐 Web research** — general online search with an autonomous pipeline. Delivers a report with sources. Good for current topics, market information and general knowledge." = "**🌐 Webrecherche** — allgemeine Onlinesuche mit einer autonomen Pipeline. Liefert einen Bericht mit Quellenangaben. Geeignet für aktuelle Themen, Marktinformationen und Allgemeinwissen."
"**📚 Check references** — checks existing bibliographies entry by entry against CrossRef, OpenAlex and further databases. Finds errors and adds DOIs. Good before submitting a manuscript." = "**📚 Literaturprüfung** — prüft vorhandene Literaturverzeichnisse Eintrag für Eintrag gegen CrossRef, OpenAlex und weitere Datenbanken. Findet Fehler und ergänzt DOIs. Geeignet vor der Einreichung eines Manuskripts."
"**📑 Find literature** — searches OpenAlex, Semantic Scholar and arXiv for your research question, assesses the hits against inclusion criteria and lists the selection with full bibliographic details. Good for a first overview before a literature review." = "**📑 Literatursuche** — durchsucht OpenAlex, Semantic Scholar und arXiv zu Ihrer Forschungsfrage, bewertet die Treffer anhand von Einschlusskriterien und listet die Auswahl mit vollständigen bibliografischen Angaben. Geeignet für einen ersten Überblick vor einem Literature Review."
"### 🧠 Analysis modes" = "### 🧠 Analysemodi"
"**📖 In-depth explanation** — explains a topic for a specific audience with a structured build-up. Good for teaching preparation or getting into new fields." = "**📖 Vertiefte Erklärung** — erklärt ein Thema strukturiert für eine bestimmte Zielgruppe. Geeignet für die Vorbereitung von Lehre oder den Einstieg in neue Fachgebiete."
"**🔍 Peer review** — writes a structured review of a paper, aspect by aspect. Good for journal and conference reviews and for theses." = "**🔍 Peer Review** — erstellt ein strukturiertes Gutachten zu einem Paper, Aspekt für Aspekt. Geeignet für Reviews für Zeitschriften und Konferenzen sowie für Abschlussarbeiten."
"**⚖️ Decision analysis** — structured multi-criteria analysis of 2–8 options against your criteria. Good for technology choices and strategic decisions." = "**⚖️ Entscheidungsanalyse** — strukturierte multikriterielle Analyse von 2–8 Optionen anhand Ihrer Kriterien. Geeignet für Technologieauswahl und strategische Entscheidungen."
"**🔬 Research design** — develops a methodological research design from a research question: literature gap, hypotheses, method, limitations. Good for project conception and proposal outlines." = "**🔬 Forschungsdesign** — entwickelt aus einer Forschungsfrage ein methodisches Forschungsdesign: Forschungslücke, Hypothesen, Methode, Limitationen. Geeignet für die Projektkonzeption und Antragsskizzen."
"**💰 Grant proposal** — proposal draft with a real literature search for the state of research, work plan and coherence check. Good for proposals in the concept phase." = "**💰 Drittmittelantrag** — Antragsentwurf mit echter Literaturrecherche zum Forschungsstand, Arbeitsplan und Kohärenzprüfung. Geeignet für Anträge in der Konzeptphase."
"**📚 Literature review** — literature review based on a real literature search (with citation chasing, i.e. backward and forward search via citations): a synthesis per key question and a meta-synthesis. Good for thesis chapters and review articles." = "**📚 Literature Review** — Literaturübersicht auf Basis einer echten Literaturrecherche (mit Citation Chasing, also Vor- und Rückwärtssuche über Zitationen): je Leitfrage eine Synthese und eine Metasynthese. Geeignet für Kapitel von Abschlussarbeiten und Überblicksartikel."
